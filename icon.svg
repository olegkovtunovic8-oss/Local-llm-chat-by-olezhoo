<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- outer orbit rings -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.9"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.35"/>

  <!-- nodes on the orbit (model "neurons") -->
  <circle cx="256" cy="74" r="9" fill="#ffffff"/>
  <circle cx="418" cy="346" r="7" fill="#9a9a9a"/>
  <circle cx="94" cy="346" r="7" fill="#9a9a9a"/>

  <!-- connection lines from core to nodes -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.35">
    <line x1="256" y1="256" x2="256" y2="74"/>
    <line x1="256" y1="256" x2="418" y2="346"/>
    <line x1="256" y1="256" x2="94" y2="346"/>
  </g>

  <!-- core: a chip-like square with a glowing center -->
  <rect x="186" y="186" width="140" height="140" rx="34" fill="#0a0a0a" stroke="#ffffff" stroke-width="4"/>
  <rect x="206" y="206" width="100" height="100" rx="22" fill="none" stroke="#6a6a6a" stroke-width="2"/>
  <circle cx="256" cy="256" r="26" fill="url(#core)"/>

  <!-- chip pins -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="220" y1="170" x2="220" y2="186"/>
    <line x1="256" y1="170" x2="256" y2="186"/>
    <line x1="292" y1="170" x2="292" y2="186"/>
    <line x1="220" y1="326" x2="220" y2="342"/>
    <line x1="256" y1="326" x2="256" y2="342"/>
    <line x1="292" y1="326" x2="292" y2="342"/>
    <line x1="170" y1="220" x2="186" y2="220"/>
    <line x1="170" y1="256" x2="186" y2="256"/>
    <line x1="170" y1="292" x2="186" y2="292"/>
    <line x1="326" y1="220" x2="342" y2="220"/>
    <line x1="326" y1="256" x2="342" y2="256"/>
    <line x1="326" y1="292" x2="342" y2="292"/>
  </g>
</svg>
